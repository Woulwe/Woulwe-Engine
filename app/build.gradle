plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.woulwe.engine'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.woulwe.engine'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++20' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }
}
