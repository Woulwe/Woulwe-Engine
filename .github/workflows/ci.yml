name: Woulwe Engine CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render demo frame
        run: ./build/WoulweEngineDemo
      - uses: actions/upload-artifact@v4
        with:
          name: WoulweEngine-rendered-frame
          path: woulwe_frame.ppm
